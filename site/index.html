<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>謎解き代金の請求</title>
<style>
  :root {
    --bg: #f6f5f2; --card: #fff; --ink: #1d1d1f; --sub: #6b6b70;
    --line: #e4e2dc; --accent: #2f6f5e; --accent-weak: #e3efe9; --warn: #a15c00; --warn-bg: #fff4e0;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#151517; --card:#1f1f22; --ink:#ececee; --sub:#9a9aa1; --line:#2e2e33;
            --accent:#6cc2a5; --accent-weak:#203a32; --warn:#f0b35a; --warn-bg:#3a2c16; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; line-height:1.5; }
  main { max-width: 760px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  .meta { color: var(--sub); font-size: .85rem; margin-bottom: 20px; }
  .controls { display:flex; flex-wrap:wrap; gap:12px 20px; align-items:end;
              background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 16px; margin-bottom:16px; }
  label { display:flex; flex-direction:column; font-size:.8rem; color:var(--sub); gap:4px; }
  input, select { font: inherit; color: var(--ink); background: var(--bg); border:1px solid var(--line);
                  border-radius:8px; padding:6px 10px; }
  .summary { display:flex; gap:24px; margin: 0 0 16px; padding: 0 4px; }
  .summary div { font-size:.8rem; color:var(--sub); }
  .summary b { display:block; font-size:1.3rem; color:var(--ink); font-variant-numeric: tabular-nums; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; margin-bottom:12px; overflow:hidden; }
  .card header { display:flex; justify-content:space-between; align-items:center; padding:12px 16px; gap:12px; }
  .card h2 { font-size:1.05rem; margin:0; }
  .total { font-weight:700; font-variant-numeric: tabular-nums; }
  .card ul { list-style:none; margin:0; padding:0 16px 8px; }
  .card li { display:flex; justify-content:space-between; gap:12px; padding:6px 0; border-top:1px solid var(--line); font-size:.9rem; }
  .card li span:first-child { color: var(--sub); white-space: nowrap; }
  .card li .t { flex:1; color: var(--ink); }
  .card li .p { font-variant-numeric: tabular-nums; white-space:nowrap; }
  .card footer { padding: 0 16px 14px; }
  button { font: inherit; border:0; border-radius:8px; padding:8px 14px; cursor:pointer;
           background:var(--accent-weak); color:var(--accent); font-weight:600; }
  button.done { background: var(--accent); color: #fff; }
  .warn { background:var(--warn-bg); color:var(--warn); border-radius:12px; padding:12px 16px; font-size:.88rem; margin-top:20px; }
  .warn ul { margin:6px 0 0; padding-left:1.2em; }
  .empty { text-align:center; color:var(--sub); padding:40px 0; }
</style>
</head>
<body>
<main>
  <h1>謎解き代金の請求</h1>
  <div class="meta" id="meta">読み込み中…</div>

  <div class="controls">
    <label>締め日（この日まで）<input type="date" id="until"></label>
    <label>立て替えた人<select id="payer"></select></label>
    <label>表示するメンバー<select id="member"><option value="">全員</option></select></label>
  </div>

  <div class="summary" id="summary"></div>
  <div id="bills"></div>
  <div id="warnings"></div>
</main>

<script>
const $ = (id) => document.getElementById(id);
const yen = (n) => n.toLocaleString("ja-JP") + "円";
const todayJST = () => new Date(Date.now() + 9 * 3600e3).toISOString().slice(0, 10);
const mmdd = (d) => d.slice(5).replace("-", "/");
let DATA = null;

function compute(events, payer, until) {
  const bills = {}, warnings = [];
  for (const ev of events) {
    if (!ev.date || ev.date > until) continue;
    const n = ev.people || ev.members.length;
    if (ev.amount == null) { warnings.push(`金額未入力: ${ev.date} ${ev.title}`); continue; }
    if (!ev.members.length) { warnings.push(`メンバー未入力: ${ev.date} ${ev.title}`); continue; }
    if (!n) { warnings.push(`人数未入力: ${ev.date} ${ev.title}`); continue; }
    const price = Math.ceil(ev.amount / n);
    for (const m of ev.members) {
      if (m === payer) continue;
      (bills[m] ||= []).push({ ...ev, price });
    }
  }
  return { bills, warnings };
}

function message(name, items) {
  const total = items.reduce((s, i) => s + i.price, 0);
  return [
    `${name}さん`, "謎解きの代金のご請求です。", "",
    ...items.map((i) => `・${mmdd(i.date)} ${i.title}  ${yen(i.price)}`),
    "", `合計 ${yen(total)}`, "お手すきの際にお支払いをお願いします！",
  ].join("\n");
}

function render() {
  const until = $("until").value || todayJST();
  const payer = $("payer").value;
  const only = $("member").value;
  const { bills, warnings } = compute(DATA.events, payer, until);
  const names = Object.keys(bills).sort((a, b) => a.localeCompare(b, "ja"))
                      .filter((n) => !only || n === only);

  const grand = names.reduce((s, n) => s + bills[n].reduce((t, i) => t + i.price, 0), 0);
  $("summary").innerHTML = names.length
    ? `<div>請求総額<b>${yen(grand)}</b></div><div>人数<b>${names.length}人</b></div>` : "";

  const box = $("bills");
  box.innerHTML = names.length ? "" : `<div class="empty">${until} までの未受取の請求はありません</div>`;
  for (const name of names) {
    const items = bills[name];
    const total = items.reduce((s, i) => s + i.price, 0);
    const card = document.createElement("section");
    card.className = "card";
    card.innerHTML = `
      <header><h2></h2><span class="total">${yen(total)}</span></header>
      <ul>${items.map(() => `<li><span></span><span class="t"></span><span class="p"></span></li>`).join("")}</ul>
      <footer><button type="button">請求文をコピー</button></footer>`;
    card.querySelector("h2").textContent = name;
    card.querySelectorAll("li").forEach((li, k) => {
      const [d, t, p] = li.children;
      d.textContent = mmdd(items[k].date);
      t.textContent = items[k].title;
      p.textContent = yen(items[k].price);
    });
    const btn = card.querySelector("button");
    btn.onclick = async () => {
      const text = message(name, items);
      try { await navigator.clipboard.writeText(text); }
      catch { prompt("コピーしてください", text); return; }
      btn.textContent = "コピーしました"; btn.classList.add("done");
      setTimeout(() => { btn.textContent = "請求文をコピー"; btn.classList.remove("done"); }, 1600);
    };
    box.appendChild(card);
  }

  const w = $("warnings");
  w.innerHTML = "";
  if (warnings.length) {
    w.className = "warn";
    w.innerHTML = "<b>請求に含めていない公演</b><ul></ul>";
    const ul = w.querySelector("ul");
    for (const s of warnings) { const li = document.createElement("li"); li.textContent = s; ul.appendChild(li); }
  } else w.className = "";
}

async function init() {
  try {
    const res = await fetch("data.json", { cache: "no-store" });
    DATA = await res.json();
  } catch {
    $("meta").textContent = "data.json を読み込めませんでした";
    return;
  }
  $("meta").textContent = `最終更新: ${DATA.updated.replace("T", " ").slice(0, 16)}（受取チェックOFFの公演 ${DATA.events.length}件）`;

  const all = [...new Set(DATA.events.flatMap((e) => e.members))].sort((a, b) => a.localeCompare(b, "ja"));
  const payerSel = $("payer"), memberSel = $("member");
  for (const m of all) {
    payerSel.add(new Option(m, m));
    memberSel.add(new Option(m, m));
  }
  let savedPayer = null;
  try { savedPayer = localStorage.getItem("payer"); } catch {}
  payerSel.value = all.includes(savedPayer) ? savedPayer : (all.includes("ヒロ") ? "ヒロ" : all[0] || "");
  $("until").value = todayJST();

  payerSel.onchange = () => { try { localStorage.setItem("payer", payerSel.value); } catch {} render(); };
  $("until").onchange = render;
  memberSel.onchange = render;
  render();
}
init();
</script>
</body>
</html>
