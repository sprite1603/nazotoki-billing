<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>謎解き代金の請求</title>
<style>
  :root {
    --bg:#f6f5f2; --card:#fff; --ink:#1d1d1f; --sub:#6b6b70; --line:#e4e2dc;
    --accent:#2f6f5e; --accent-weak:#e3efe9; --warn:#a15c00; --warn-bg:#fff4e0; --done:#8a8a90;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#151517; --card:#1f1f22; --ink:#ececee; --sub:#9a9aa1; --line:#2e2e33;
            --accent:#6cc2a5; --accent-weak:#203a32; --warn:#f0b35a; --warn-bg:#3a2c16; --done:#77777e; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif; line-height:1.5; }
  main { max-width:760px; margin:0 auto; padding:24px 16px 64px; }
  h1 { font-size:1.4rem; margin:0 0 4px; }
  .meta { color:var(--sub); font-size:.85rem; margin-bottom:16px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .meta button { padding:4px 10px; font-size:.8rem; }
  .tabs { display:flex; gap:4px; background:var(--line); padding:4px; border-radius:10px; margin-bottom:12px; width:fit-content; }
  .tabs button { background:transparent; color:var(--sub); }
  .tabs button[aria-selected="true"] { background:var(--card); color:var(--ink); box-shadow:0 1px 2px rgba(0,0,0,.08); }
  .controls { display:flex; flex-wrap:wrap; gap:10px 20px; align-items:center;
              background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 16px; margin-bottom:16px; font-size:.88rem; }
  .controls label { display:flex; align-items:center; gap:6px; color:var(--sub); }
  select { font:inherit; color:var(--ink); background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:4px 8px; }
  input[type=checkbox] { accent-color:var(--accent); width:16px; height:16px; }
  .summary { display:flex; gap:24px; margin:0 0 16px; padding:0 4px; }
  .summary div { font-size:.8rem; color:var(--sub); }
  .summary b { display:block; font-size:1.3rem; color:var(--ink); font-variant-numeric:tabular-nums; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; margin-bottom:12px; overflow:hidden; }
  .card.received { opacity:.6; }
  .card header { display:flex; justify-content:space-between; align-items:center; padding:12px 16px 8px; gap:12px; }
  .card h2 { font-size:1.05rem; margin:0; display:flex; align-items:center; gap:8px; }
  .badge { font-size:.72rem; font-weight:600; padding:2px 8px; border-radius:99px; background:var(--warn-bg); color:var(--warn); }
  .badge.ok { background:var(--accent-weak); color:var(--accent); }
  .badge.future { background:var(--line); color:var(--sub); }
  .total { font-weight:700; font-variant-numeric:tabular-nums; }
  .events { list-style:none; margin:0; padding:0 16px; }
  .events li { display:flex; justify-content:space-between; gap:12px; padding:6px 0; border-top:1px solid var(--line); font-size:.9rem; }
  .events li .t { flex:1; }
  .events li .p { color:var(--sub); font-variant-numeric:tabular-nums; white-space:nowrap; }
  .events li.done .t { color:var(--done); text-decoration:line-through; }
  .events li.ng .p { color:var(--warn); }
  .who { display:flex; flex-wrap:wrap; gap:6px; padding:10px 16px 4px; border-top:1px solid var(--line); }
  .who span { background:var(--bg); border:1px solid var(--line); border-radius:99px; padding:2px 10px; font-size:.85rem; font-variant-numeric:tabular-nums; }
  .card footer { padding:8px 16px 14px; }
  button { font:inherit; border:0; border-radius:8px; padding:8px 14px; cursor:pointer;
           background:var(--accent-weak); color:var(--accent); font-weight:600; }
  button.copied { background:var(--accent); color:#fff; }
  .warn { background:var(--warn-bg); color:var(--warn); border-radius:12px; padding:12px 16px; font-size:.88rem; margin-top:20px; }
  .warn ul { margin:6px 0 0; padding-left:1.2em; }
  .empty { text-align:center; color:var(--sub); padding:40px 0; }
  .error { background:var(--warn-bg); color:var(--warn); border-radius:12px; padding:14px 16px; }
</style>
</head>
<body>
<main>
  <h1>謎解き代金の請求</h1>
  <div class="meta"><span id="meta">Notion から読み込み中…</span><button id="reload" hidden>再読み込み</button></div>

  <div class="tabs" role="tablist">
    <button role="tab" data-view="date" aria-selected="true">日付ごと</button>
    <button role="tab" data-view="member" aria-selected="false">メンバーごと</button>
  </div>

  <div class="controls">
    <label><input type="checkbox" id="unpaid" checked>未受取のみ</label>
    <label><input type="checkbox" id="future">今後の予定も表示</label>
    <label>立て替え<select id="payer"></select></label>
    <label>メンバー<select id="member"><option value="">全員</option></select></label>
  </div>

  <div class="summary" id="summary"></div>
  <div id="list"></div>
  <div id="warnings"></div>
</main>

<script src="config.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const yen = (n) => n.toLocaleString("ja-JP") + "円";
const todayJST = () => new Date(Date.now() + 9 * 3600e3).toISOString().slice(0, 10);
const WD = "日月火水木金土";
const fmtDate = (d) => { const [y, m, dd] = d.split("-").map(Number);
  return `${m}/${dd}(${WD[new Date(Date.UTC(y, m - 1, dd)).getUTCDay()]})`; };
const byJa = (a, b) => a.localeCompare(b, "ja");
const el = (tag, cls, text) => { const e = document.createElement(tag);
  if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

let EVENTS = [], VIEW = "date";

/* ---------- 集計 ---------- */
function priced(ev) {
  const n = ev.people || ev.members.length;
  if (ev.amount == null) return { ...ev, price: null, issue: "金額未入力" };
  if (!ev.members.length) return { ...ev, price: null, issue: "メンバー未入力" };
  if (!n) return { ...ev, price: null, issue: "人数未入力" };
  return { ...ev, price: Math.ceil(ev.amount / n) };
}

function filtered() {
  const today = todayJST(), unpaid = $("unpaid").checked, future = $("future").checked, only = $("member").value;
  return EVENTS.map(priced).filter((ev) =>
    ev.date && (future || ev.date <= today) && (!unpaid || !ev.received) && (!only || ev.members.includes(only)));
}

/** 1日分のイベントからメンバーごとの金額を出す（立て替え者・受取済みは除外） */
function owedByMember(events, payer, only) {
  const owed = {};
  for (const ev of events) {
    if (ev.price == null || ev.received) continue;
    for (const m of ev.members) {
      if (m === payer || (only && m !== only)) continue;
      owed[m] = (owed[m] || 0) + ev.price;
    }
  }
  return owed;
}

/* ---------- コピー ---------- */
function copyButton(label, getText) {
  const b = el("button", "", label);
  b.onclick = async () => {
    const text = getText();
    try { await navigator.clipboard.writeText(text); } catch { prompt("コピーしてください", text); return; }
    b.textContent = "コピーしました"; b.classList.add("copied");
    setTimeout(() => { b.textContent = label; b.classList.remove("copied"); }, 1600);
  };
  return b;
}

function dayMessage(date, events, owed) {
  const lines = [`【${fmtDate(date)} 謎解き代金】`];
  for (const ev of events) if (ev.price != null && !ev.received) lines.push(`・${ev.title}（${yen(ev.price)}/人）`);
  lines.push("");
  for (const m of Object.keys(owed).sort(byJa)) lines.push(`${m}：${yen(owed[m])}`);
  lines.push("", "お手すきの際にお支払いをお願いします！");
  return lines.join("\n");
}

function memberMessage(name, items) {
  const total = items.reduce((s, i) => s + i.price, 0);
  return [`${name}さん`, "謎解きの代金のご請求です。", "",
    ...items.map((i) => `・${fmtDate(i.date)} ${i.title}  ${yen(i.price)}`),
    "", `合計 ${yen(total)}`, "お手すきの際にお支払いをお願いします！"].join("\n");
}

/* ---------- 描画 ---------- */
function render() {
  const payer = $("payer").value, only = $("member").value, today = todayJST();
  const events = filtered();
  const list = $("list"); list.innerHTML = "";

  const warnings = events.filter((e) => e.issue && !e.received && e.date <= today)
                         .map((e) => `${e.issue}: ${fmtDate(e.date)} ${e.title}`);
  const owedAll = owedByMember(events.filter((e) => e.date <= today), payer, only);
  const grand = Object.values(owedAll).reduce((s, v) => s + v, 0);
  $("summary").innerHTML = "";
  const s1 = el("div", "", "未受取の合計"); s1.appendChild(el("b", "", yen(grand)));
  const s2 = el("div", "", "請求する人数"); s2.appendChild(el("b", "", Object.keys(owedAll).length + "人"));
  $("summary").append(s1, s2);

  if (VIEW === "date") renderByDate(list, events, payer, only, today);
  else renderByMember(list, events, payer, only, today);

  if (!list.children.length) list.appendChild(el("div", "empty", "表示する請求はありません"));

  const w = $("warnings"); w.innerHTML = ""; w.className = "";
  if (warnings.length) {
    w.className = "warn"; w.appendChild(el("b", "", "請求に含めていない公演"));
    const ul = el("ul"); warnings.forEach((t) => ul.appendChild(el("li", "", t))); w.appendChild(ul);
  }
}

function renderByDate(list, events, payer, only, today) {
  const days = {};
  for (const ev of events) (days[ev.date] ||= []).push(ev);
  for (const date of Object.keys(days).sort().reverse()) {
    const evs = days[date];
    const owed = owedByMember(evs, payer, only);
    const total = Object.values(owed).reduce((s, v) => s + v, 0);
    const allReceived = evs.every((e) => e.received), someReceived = evs.some((e) => e.received);
    const isFuture = date > today;

    const card = el("section", "card" + (allReceived ? " received" : ""));
    const head = el("header"), h2 = el("h2", "", fmtDate(date));
    h2.appendChild(isFuture ? el("span", "badge future", "予定")
      : allReceived ? el("span", "badge ok", "受取済")
      : el("span", "badge", someReceived ? "一部未受取" : "未受取"));
    head.append(h2, el("span", "total", total ? yen(total) : ""));
    card.appendChild(head);

    const ul = el("ul", "events");
    for (const ev of evs) {
      const li = el("li", ev.received ? "done" : ev.price == null ? "ng" : "");
      li.append(el("span", "t", ev.title), el("span", "p", ev.price == null ? ev.issue : `${yen(ev.price)}/人 × ${ev.people || ev.members.length}`));
      ul.appendChild(li);
    }
    card.appendChild(ul);

    const names = Object.keys(owed).sort(byJa);
    if (names.length) {
      const who = el("div", "who");
      for (const m of names) who.appendChild(el("span", "", `${m} ${yen(owed[m])}`));
      card.appendChild(who);
      if (!isFuture) {
        const f = el("footer"); f.appendChild(copyButton("この日の請求文をコピー", () => dayMessage(date, evs, owed)));
        card.appendChild(f);
      }
    }
    list.appendChild(card);
  }
}

function renderByMember(list, events, payer, only, today) {
  const bills = {};
  for (const ev of events) {
    if (ev.price == null || ev.received) continue;
    for (const m of ev.members) {
      if (m === payer || (only && m !== only)) continue;
      (bills[m] ||= []).push(ev);
    }
  }
  for (const name of Object.keys(bills).sort(byJa)) {
    const items = bills[name];
    const total = items.reduce((s, i) => s + i.price, 0);
    const card = el("section", "card");
    const head = el("header"); head.append(el("h2", "", name), el("span", "total", yen(total)));
    const ul = el("ul", "events");
    for (const i of items) {
      const li = el("li"); li.append(el("span", "p", fmtDate(i.date)), el("span", "t", i.title), el("span", "p", yen(i.price)));
      ul.appendChild(li);
    }
    const f = el("footer"); f.appendChild(copyButton("請求文をコピー", () => memberMessage(name, items)));
    card.append(head, ul, f);
    list.appendChild(card);
  }
}

/* ---------- 読み込み ---------- */
async function load() {
  $("meta").textContent = "Notion から読み込み中…"; $("reload").hidden = true;
  try {
    if (!window.API_URL) throw new Error("config.js の API_URL が未設定です");
    const res = await fetch(window.API_URL, { cache: "no-store" });
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    EVENTS = data.events;
    $("meta").textContent = `取得: ${data.updated.replace("T", " ")}（全 ${EVENTS.length} 件）`;
  } catch (e) {
    $("meta").textContent = "";
    $("list").innerHTML = ""; $("list").appendChild(el("div", "error", "読み込みに失敗しました: " + e.message));
    $("reload").hidden = false;
    return;
  }
  $("reload").hidden = false;

  const all = [...new Set(EVENTS.flatMap((e) => e.members))].sort(byJa);
  const payerSel = $("payer"), memberSel = $("member");
  const prevPayer = payerSel.value, prevMember = memberSel.value;
  payerSel.innerHTML = ""; memberSel.innerHTML = '<option value="">全員</option>';
  for (const m of all) { payerSel.add(new Option(m, m)); memberSel.add(new Option(m, m)); }
  let saved = prevPayer; try { saved ||= localStorage.getItem("payer"); } catch {}
  payerSel.value = all.includes(saved) ? saved : all.includes("ヒロ") ? "ヒロ" : all[0] || "";
  memberSel.value = all.includes(prevMember) ? prevMember : "";
  render();
}

document.querySelectorAll(".tabs button").forEach((b) => b.onclick = () => {
  VIEW = b.dataset.view;
  document.querySelectorAll(".tabs button").forEach((x) => x.setAttribute("aria-selected", x === b));
  render();
});
$("payer").onchange = () => { try { localStorage.setItem("payer", $("payer").value); } catch {} render(); };
["unpaid", "future", "member"].forEach((id) => $(id).onchange = render);
$("reload").onclick = load;
load();
</script>
</body>
</html>
